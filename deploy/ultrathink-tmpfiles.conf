# Installed as /etc/tmpfiles.d/ultrathink.conf:
#   install -m 0644 deploy/ultrathink-tmpfiles.conf /etc/tmpfiles.d/ultrathink.conf && systemd-tmpfiles --create /etc/tmpfiles.d/ultrathink.conf
# The backup directory must exist before ultrathink-maintenance.service starts: systemd builds the sandbox mount
# namespace for ReadWritePaths= before any ExecStartPre= runs (even a "+" one), so a pre-start mkdir cannot create it
# and the unit would fail with status=226/NAMESPACE. tmpfiles.d recreates it at boot if it goes missing.
d /var/backups/ultrathink 0700 ultrathink ultrathink -
