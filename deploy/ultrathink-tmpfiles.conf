# Installed as /etc/tmpfiles.d/ultrathink.conf:
#   install -m 0644 deploy/ultrathink-tmpfiles.conf /etc/tmpfiles.d/ultrathink.conf && systemd-tmpfiles --create /etc/tmpfiles.d/ultrathink.conf
# The backup directory must exist before ultrathink-maintenance.service starts: systemd builds the sandbox mount
# namespace for ReadWritePaths= before any ExecStartPre= runs (even a "+" one), so a pre-start mkdir cannot create it
# and the unit would fail with status=226/NAMESPACE. tmpfiles.d recreates it at boot if it goes missing.
d /var/backups/ultrathink 0700 ultrathink ultrathink -

# Internal TLS (phase 69). The same reasoning applies: ultrathink-web (ReadOnlyPaths=) and ultrathink-cert-renew
# (ReadWritePaths=) need these directories to exist before they start. The PKI script writes the files inside them.
# /etc/ultrathink/tls is group ultrathink so the service user can traverse it to reach ca.pem and app/. The
# intermediate, edge and ops directories stay root-only: only root reads those keys.
d /etc/ultrathink/tls 0750 root ultrathink -
d /etc/ultrathink/tls/intermediate 0700 root root -
d /etc/ultrathink/tls/app 0750 root ultrathink -
d /etc/ultrathink/tls/edge 0700 root root -
d /etc/ultrathink/tls/ops 0700 root root -
