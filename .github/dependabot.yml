version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows current, one grouped pull request a week.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        patterns: ["*"]

  # Keeps the dev dependencies in package.json and bun.lock current, one grouped pull request a week.
  - package-ecosystem: bun
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      bun:
        patterns: ["*"]
