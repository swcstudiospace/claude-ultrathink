# Creates a GitHub release when a semantic-version tag is pushed. It never publishes to a registry (the package
# is private) and only runs for tags like v1.5.0 or v1.5.0-rc.1; milestone tags such as v1.3 do not match.
# The tag is checked against package.json, every manifest and CHANGELOG.md, the gates run again, and the
# release notes are the tag's CHANGELOG.md section.
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      # hosts/hermes and hosts/prime-agent need Python 3.10+; pin the minimum so newer syntax is caught.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The runner has no git identity and git refuses to commit without one; set it in case a test shells out to git.
      - name: Configure git identity
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci

      # The tag reaches the script through the environment, never through the script text.
      - name: Verify tag, manifests and changelog agree
        env:
          TAG: ${{ github.ref_name }}
        run: bun scripts/release-check.ts --tag "$TAG"

      - name: Type check
        run: bun run check

      - name: Test
        run: bun test

      - name: Hermes bridge test
        run: python3 hosts/hermes/bridge_test.py

      - name: Prime Agent bridge test
        run: python3 hosts/prime-agent/bridge_test.py

      - name: Extract release notes
        run: bun scripts/release-check.ts --notes > RELEASE_NOTES.md

      # A tag with a hyphen (v1.5.0-rc.1) is a prerelease. --verify-tag aborts instead of creating a tag that is not already on the remote.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ "$TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" --verify-tag --title "ultrathink ${TAG#v}" --notes-file RELEASE_NOTES.md "${flags[@]}"
