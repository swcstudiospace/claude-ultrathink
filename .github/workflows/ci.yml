name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request cancels its superseded run; runs on main always finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Check and test (${{ matrix.os }}, Bun ${{ matrix.bun }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # 1.2.x is the minimum in package.json "engines"; latest catches regressions early.
        bun: [1.2.x, latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ matrix.bun }}

      # hosts/hermes and hosts/prime-agent need Python 3.10+; pin the minimum so newer syntax is caught.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      # ultrathink has no runtime dependencies; `bun install` only fetches type definitions for the type check.
      # bun.lock uses a lockfile format Bun 1.2 cannot read, so the minimum-Bun leg runs the tests without it.
      - name: Install dependencies
        if: matrix.bun == 'latest'
        run: bun install --frozen-lockfile

      - name: Type check
        if: matrix.bun == 'latest'
        run: bun run check

      # The runner has no git identity and git refuses to commit without one; set it in case a test shells out to git.
      - name: Configure git identity
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci

      - name: Test
        run: bun test

      - name: Hermes bridge test
        run: python3 hosts/hermes/bridge_test.py

      - name: Prime Agent bridge test
        run: python3 hosts/prime-agent/bridge_test.py
